services:
    dev-db:
        image: postgres
        ports:
            - "${PG_PORT}:5432"
        environment:
            - POSTGRES_PASSWORD=${PG_PASSWORD}
            - POSTGRES_USER=${PG_USER}
            - POSTGRES_DB=${PG_DB}
        volumes:
            - dev-data:/var/lib/postgresql

volumes:
    dev-data:
